version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      PGDATA: /data/postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: ./config
    command: [ "./auth", "--config=./config/local.yaml" ]
    restart: always

volumes:
  postgres-data:
